name: Django CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Atualizar pip e ferramentas de build
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install ruff

      # Baseline: o projeto tem erros de ruff pre-existentes (ver
      # pyproject.toml). O relatorio completo roda sem bloquear; o que e
      # novo/mantido pela auditoria precisa estar limpo.
      - name: Lint com ruff (relatório geral, não bloqueia)
        continue-on-error: true
        run: |
          ruff check . --statistics

      - name: Lint com ruff (auditoria e admin, bloqueia)
        run: |
          ruff check core/admin.py apps/core_domain/auditoria

      - name: Verificar configuração do Django
        run: python manage.py check

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar migrações
        run: python manage.py migrate --noinput

      - name: Rodar testes
        run: python manage.py test
