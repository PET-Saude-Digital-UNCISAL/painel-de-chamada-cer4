<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checagem de documentos</title>
    <style>
        :root {
            --primary-blue: #002D62;
            --success-green: #1C8F45;
            --background-light: #F4F6F8;
            --border-light: #E0E0E0;
            --text-color: #002D62;
            --text-muted: #6F6F6F;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Fundo cinza para simular a tela de celular */
        }

        .container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
            background-color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); /* Sombra para o dispositivo móvel */
        }

        .header {
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--background-light);
        }

        .icon-settings {
            font-size: 24px;
            color: var(--primary-blue);
            cursor: pointer;
        }

        .content {
            flex: 1;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .content h1 {
            color: var(--primary-blue);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        .content p {
            color: var(--text-color);
            margin-bottom: 40px;
            font-size: 16px;
            line-height: 1.5;
            max-width: 90%;
        }

        .content strong {
            font-weight: bold;
        }

        .checklist {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
            max-width: 300px;
            text-align: left;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .icon-status {
            width: 44px;
            height: 44px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        .icon-check-green {
            border-radius: 50%;
            border: 2px solid var(--success-green);
        }

        .icon-check-green::after {
            content: '✔';
            color: var(--success-green);
            font-size: 22px;
            font-weight: bold;
        }

        .icon-square-empty {
            border: 2px solid var(--border-light);
            border-radius: 8px; /* Cantos arredondados */
            width: 40px;
            height: 40px;
        }

        .checklist-text {
            color: var(--primary-blue);
            font-size: 14px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .checklist-item.done .checklist-text s {
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: var(--background-light);
            border-top: 1px solid var(--border-light);
        }

        .footer-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: var(--primary-blue);
            font-size: 10px;
        }

        .footer-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .contrast-icon {
            font-size: 24px;
        }

        .accessibility-icon {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <span class="icon-settings">&#9881;</span> <!-- Caractere Unicode para engrenagem -->
        </header>
        <main class="content">
            <h1>Bem-vindo, John</h1>
            <p>Identificamos que você veio para o Exame <strong>Lorem Ipsum</strong>. Por favor, dirija-se à <strong>Recepção 2</strong> e apresente seu pedido médico original.</p>
            <ul class="checklist">
                <li class="checklist-item done">
                    <span class="icon-status icon-check-green"></span>
                    <span class="checklist-text"><s>PEDIDO MÉDICO</s></span>
                </li>
                <li class="checklist-item todo">
                    <span class="icon-status icon-square-empty"></span>
                    <span class="checklist-text">DOCUMENTO COM FOTO</span>
                </li>
            </ul>
        </main>
        <footer class="footer">
            <div class="footer-item">
                <span class="footer-icon">&#128274;</span> <!-- Caractere Unicode para cadeado -->
                <span class="footer-text">LGPD<br>Conforme</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon">&#128737;</span> <!-- Caractere Unicode para escudo -->
                <span class="footer-text">Conexão<br>Segura</span>
            </div>
            <div class="footer-item">
                <span class="footer-icon contrast-icon">&#9681;</span> <!-- Caractere Unicode para contraste -->
            </div>
            <div class="footer-item">
                <span class="footer-icon accessibility-icon">T</span>
            </div>
        </footer>
    </div>
</body>
</html>
