<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <style>
    @view-transition {
      navigation: auto;
    }

    @font-face {
      font-family: "Public Sans";
      src: url("{{ public_sans_font_url }}") format("truetype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: "Inter";
      src: url("{{ inter_font_url }}") format("truetype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      color: #001a4d;
      background: #e8edf2;
      font-family: "Public Sans", Arial, sans-serif;
      font-synthesis: none;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .screen {
      position: relative;
      width: 390px;
      min-height: max(871px, 100svh);
      overflow: hidden;
      background: #f7f9fb;
    }

    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      width: 100%;
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(247, 249, 251, 0.8);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(12px);
    }

    .topbar-spacer {
      width: 25px;
      height: 25px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: transparent;
      border: 0;
      border-radius: 9999px;
    }

    .success-section {
      position: absolute;
      top: 104px;
      left: 50%;
      width: 290px;
      text-align: center;
      transform: translateX(-50%);
    }

    .success-icon {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      background: #f0fdf4;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.72);
      animation: success-shell-in 720ms cubic-bezier(0.16, 1, 0.3, 1) 100ms both;
    }

    .success-icon::after {
      position: absolute;
      inset: 10px;
      z-index: 0;
      content: "";
      border: 2px solid rgba(34, 197, 94, 0.3);
      border-radius: 50%;
      opacity: 0;
      animation: success-halo 780ms cubic-bezier(0.16, 1, 0.3, 1) 430ms both;
    }

    .success-mark {
      position: relative;
      z-index: 1;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 10px 24px rgba(34, 197, 94, 0.2);
      transform: scale(0);
      animation: success-mark-in 760ms cubic-bezier(0.34, 1.56, 0.64, 1) 190ms both;
    }

    .success-check {
      stroke-dasharray: 32;
      stroke-dashoffset: 32;
      animation: success-check-draw 460ms cubic-bezier(0.65, 0, 0.35, 1) 480ms both;
    }

    .title {
      color: #001848;
      font-family: "Inter", Arial, sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 38.4px;
      letter-spacing: -0.35px;
      white-space: nowrap;
      opacity: 0;
      filter: blur(5px);
      animation: content-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) 420ms both;
    }

    .subtitle {
      margin-top: 8px;
      color: #4f657b;
      font-size: 18px;
      font-weight: 400;
      line-height: 27px;
      white-space: nowrap;
      opacity: 0;
      filter: blur(4px);
      animation: content-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) 500ms both;
    }

    .patient-card {
      position: absolute;
      top: 313px;
      left: 24px;
      right: 24px;
      height: 265px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #f1f5f9;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 26, 77, 0.08);
      opacity: 0;
      filter: blur(7px);
      transform: translateY(22px) scale(0.985);
      animation: card-rise 820ms cubic-bezier(0.16, 1, 0.3, 1) 570ms both;
    }

    .patient-data {
      position: absolute;
      top: 24px;
      left: 24px;
      right: 24px;
      height: 63px;
      border-bottom: 1px solid #ececec;
    }

    .eyebrow {
      color: #4f657b;
      font-size: 12px;
      font-weight: 700;
      line-height: 14.4px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .patient-name {
      margin-top: 8px;
      color: #000314;
      font-family: "Inter", "Public Sans", Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      line-height: 20.5px;
      text-transform: uppercase;
    }

    .ticket {
      position: absolute;
      top: 113px;
      left: 20px;
      right: 22px;
      height: 128px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: linear-gradient(90deg, #00226b 0%, #0c307f 100%);
      border: 1px solid rgba(227, 226, 231, 0.3);
      border-radius: 16px;
      transform-origin: center;
      view-transition-name: attendance-ticket;
      animation: ticket-settle 680ms cubic-bezier(0.16, 1, 0.3, 1) 720ms both;
    }

    .ticket-label {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      line-height: 14.4px;
      letter-spacing: 0.6px;
      text-align: center;
      text-transform: uppercase;
    }

    .ticket-number {
      font-size: 60px;
      font-weight: 800;
      line-height: 60px;
      letter-spacing: -3px;
    }

    .guidance {
      position: absolute;
      top: 615px;
      left: 50%;
      width: 295px;
      color: #001a4d;
      font-family: "Inter", "Public Sans", Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 24px;
      text-align: center;
      opacity: 0;
      transform: translateX(-50%);
      animation: guidance-rise 720ms cubic-bezier(0.16, 1, 0.3, 1) 720ms both;
    }

    .follow-button {
      position: absolute;
      top: 681px;
      left: 28px;
      right: 28px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: #fff;
      background: #001b56;
      border: 0;
      border-radius: 9999px;
      box-shadow: 0 9px 14px -3px rgba(0, 71, 141, 0.2), 0 4px 6px -4px rgba(0, 71, 141, 0.2);
      font-size: 18.66px;
      font-weight: 700;
      line-height: 26px;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px) scale(0.96);
      animation: button-rise 820ms cubic-bezier(0.34, 1.35, 0.64, 1) 800ms both;
    }

    .follow-button:focus-visible {
      outline: 3px solid rgba(0, 71, 141, 0.28);
      outline-offset: 3px;
    }

    .follow-button:hover {
      background: #00246f;
    }

    .follow-button:active {
      filter: brightness(0.94);
    }

    .footer {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 85px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(194, 198, 212, 0.1);
      background: #f7f9fb;
    }

    .footer-indicators {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-text {
      color: #466178;
      font-family: "Inter", Arial, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .accessibility-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #466178;
      border-radius: 9999px;
    }

    @keyframes success-shell-in {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }
      70% {
        opacity: 1;
        transform: scale(1.04);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes success-mark-in {
      0% {
        transform: scale(0);
      }
      72% {
        transform: scale(1.08);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes success-check-draw {
      from {
        stroke-dashoffset: 32;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes success-halo {
      0% {
        opacity: 0.5;
        transform: scale(0.74);
      }
      100% {
        opacity: 0;
        transform: scale(1.65);
      }
    }

    @keyframes content-rise {
      from {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes card-rise {
      from {
        opacity: 0;
        filter: blur(7px);
        transform: translateY(22px) scale(0.985);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ticket-settle {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.975);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes guidance-rise {
      from {
        opacity: 0;
        transform: translate(-50%, 12px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes button-rise {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    ::view-transition-old(root) {
      animation: route-fade-out 180ms ease-in both;
    }

    ::view-transition-new(root) {
      animation: route-fade-in 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    ::view-transition-group(attendance-ticket) {
      z-index: 20;
      animation-duration: 480ms;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    ::view-transition-old(attendance-ticket),
    ::view-transition-new(attendance-ticket) {
      height: 100%;
      mix-blend-mode: normal;
    }

    @keyframes route-fade-out {
      to {
        opacity: 0;
      }
    }

    @keyframes route-fade-in {
      from {
        opacity: 0;
        transform: translateY(7px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .success-icon,
      .success-mark,
      .success-check,
      .title,
      .subtitle,
      .patient-card,
      .ticket,
      .guidance,
      .follow-button {
        animation: none !important;
        opacity: 1 !important;
        filter: none !important;
        transform: none !important;
      }

      .success-check {
        stroke-dashoffset: 0;
      }

      .guidance {
        transform: translateX(-50%) !important;
      }

      .success-icon::after {
        display: none;
      }

      ::view-transition-old(root),
      ::view-transition-new(root),
      ::view-transition-group(attendance-ticket) {
        animation-duration: 1ms !important;
      }
    }

    @media (max-width: 430px) {
      .screen {
        width: 100%;
      }
    }

    @media (max-width: 370px) {
      .title {
        font-size: 29px;
      }

      .subtitle {
        font-size: 16px;
      }

      .patient-card {
        left: 18px;
        right: 18px;
      }

      .follow-button {
        left: 22px;
        right: 22px;
      }

      .footer {
        padding-right: 16px;
        padding-left: 16px;
      }

      .footer-indicators {
        gap: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="topbar-spacer" aria-hidden="true"></div>
      <button class="icon-button" type="button" aria-label="Configurações">
        <svg width="21" height="20" viewBox="0 0 20.1 20" fill="none" aria-hidden="true">
          <path d="M7.3 20L6.9 16.8C6.68333 16.7167 6.47917 16.6167 6.2875 16.5C6.09583 16.3833 5.90833 16.2583 5.725 16.125L2.75 17.375L0 12.625L2.575 10.675C2.55833 10.5583 2.55 10.4458 2.55 10.3375V9.6625C2.55 9.55417 2.55833 9.44167 2.575 9.325L0 7.375L2.75 2.625L5.725 3.875C5.90833 3.74167 6.1 3.61667 6.3 3.5C6.5 3.38333 6.7 3.28333 6.9 3.2L7.3 0H12.8L13.2 3.2C13.4167 3.28333 13.6208 3.38333 13.8125 3.5C14.0042 3.61667 14.1917 3.74167 14.375 3.875L17.35 2.625L20.1 7.375L17.525 9.325C17.5417 9.44167 17.55 9.55417 17.55 9.6625V10.3375C17.55 10.4458 17.5333 10.5583 17.5 10.675L20.075 12.625L17.325 17.375L14.375 16.125C14.1917 16.2583 14 16.3833 13.8 16.5C13.6 16.6167 13.4 16.7167 13.2 16.8L12.8 20H7.3ZM9.05 18H11.025L11.375 15.35C11.8917 15.2167 12.3708 15.0208 12.8125 14.7625C13.2542 14.5042 13.6583 14.1917 14.025 13.825L16.5 14.85L17.475 13.15L15.325 11.525C15.4083 11.2917 15.4667 11.0458 15.5 10.7875C15.5333 10.5292 15.55 10.2667 15.55 10C15.55 9.73333 15.5333 9.47083 15.5 9.2125C15.4667 8.95417 15.4083 8.70833 15.325 8.475L17.475 6.85L16.5 5.15L14.025 6.2C13.6583 5.81667 13.2542 5.49583 12.8125 5.2375C12.3708 4.97917 11.8917 4.78333 11.375 4.65L11.05 2H9.075L8.725 4.65C8.20833 4.78333 7.72917 4.97917 7.2875 5.2375C6.84583 5.49583 6.44167 5.80833 6.075 6.175L3.6 5.15L2.625 6.85L4.775 8.45C4.69167 8.7 4.63333 8.95 4.6 9.2C4.56667 9.45 4.55 9.71667 4.55 10C4.55 10.2667 4.56667 10.525 4.6 10.775C4.63333 11.025 4.69167 11.275 4.775 11.525L2.625 13.15L3.6 14.85L6.075 13.8C6.44167 14.1833 6.84583 14.5042 7.2875 14.7625C7.72917 15.0208 8.20833 15.2167 8.725 15.35L9.05 18ZM10.1 13.5C11.0667 13.5 11.8917 13.1583 12.575 12.475C13.2583 11.7917 13.6 10.9667 13.6 10C13.6 9.03333 13.2583 8.20833 12.575 7.525C11.8917 6.84167 11.0667 6.5 10.1 6.5C9.11667 6.5 8.2875 6.84167 7.6125 7.525C6.9375 8.20833 6.6 9.03333 6.6 10C6.6 10.9667 6.9375 11.7917 7.6125 12.475C8.2875 13.1583 9.11667 13.5 10.1 13.5Z" fill="#64748b"/>
        </svg>
      </button>
    </header>

    <main>
      <section class="success-section" aria-labelledby="checkin-title">
        <div class="success-icon" aria-hidden="true">
          <span class="success-mark">
            <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
              <path class="success-check" d="M9.5 19.5 16 26l13-14" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>
        <h1 class="title" id="checkin-title">{{ title }}</h1>
        <p class="subtitle">{{ subtitle }}</p>
      </section>

      <section class="patient-card" aria-label="Dados do atendimento">
        <div class="patient-data">
          <p class="eyebrow">Nome do paciente</p>
          <p class="patient-name">{{ paciente }}</p>
        </div>

        <div class="ticket">
          <p class="ticket-label">Senha de atendimento</p>
          <p class="ticket-number">{{ senha }}</p>
        </div>
      </section>

      <p class="guidance">{{ mensagem }}</p>

      <a class="follow-button" href="{% url 'acompanhamento-atendimento' %}?demo=1">
        <span>{{ texto_botao }}</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M12.175 9H0V7h12.175l-5.6-5.6L8 0l8 8-8 8-1.425-1.4 5.6-5.6Z" fill="currentColor"/>
        </svg>
      </a>
    </main>

    <footer class="footer">
      <div class="footer-indicators">
        {% for indicator in footer_indicators %}
          <div class="footer-item">
            {% if indicator.icon == "lock" %}
              <svg width="10" height="13" viewBox="0 0 10 13" fill="none" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M5 0a3 3 0 0 0-3 3v1H1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1H8V3a3 3 0 0 0-3-3H5Zm2 4H3V3a2 2 0 1 1 4 0v1ZM5 7a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V8a1 1 0 0 1 1-1Z" fill="#466178"/>
              </svg>
            {% else %}
              <svg width="10" height="12" viewBox="0 0 10 12" fill="none" aria-hidden="true">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M5 0 .5 1.75v3.56C.5 8.07 2.44 10.66 5 11.67c2.56-1.01 4.5-3.6 4.5-6.36V1.75L5 0Zm2.68 4.61L4.05 8.24 2.32 6.51l.83-.83.9.9 2.8-2.8.83.83Z" fill="#466178"/>
              </svg>
            {% endif %}
            <p class="footer-text">{{ indicator.label }}<br>{{ indicator.detail }}</p>
          </div>
        {% endfor %}
      </div>

      <div class="footer-actions" aria-label="Recursos de acessibilidade">
        <span class="accessibility-icon" aria-label="Aumentar contraste" role="img">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 2.08a8 8 0 0 1 0 15.84V2.08Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="accessibility-icon" aria-label="Aumentar fonte" role="img">
          <svg width="20" height="16" viewBox="0 0 20 16" fill="none" aria-hidden="true">
            <path d="M12 16V3H7V0h13v3h-5v13h-3ZM3 16V8H0V5h9v3H6v8H3Z" fill="currentColor"/>
          </svg>
        </span>
      </div>
    </footer>
  </div>
</body>
</html>
