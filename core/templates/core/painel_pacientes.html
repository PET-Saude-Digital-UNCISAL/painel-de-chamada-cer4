<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Painel de desenvolvimento | Pacientes</title>
    <style>
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; padding:48px 24px; background:#f6f8fc; color:#172554; font-family:Inter,Arial,sans-serif; }
        main { width:min(100%,900px); margin:auto; }
        .back { display:inline-flex; margin-bottom:24px; color:#475569; font-size:14px; text-decoration:none; }
        h1 { margin:0; font-size:30px; letter-spacing:-.6px; }
        .intro { margin:8px 0 28px; color:#64748b; }
        .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
        .card { display:flex; flex-direction:column; min-height:210px; padding:22px; border:1px solid #dbe5f2; border-radius:16px; background:#fff; box-shadow:0 8px 24px rgb(15 23 42 / 6%); }
        .label { color:#2563eb; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
        h2 { margin:16px 0 12px; color:#1e293b; font-size:18px; line-height:1.3; }
        .owner { margin:0; color:#64748b; font-size:14px; }
        .route { display:block; margin-top:10px; overflow-wrap:anywhere; color:#475569; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
        .open { margin-top:auto; padding-top:20px; color:#1d4ed8; font-size:14px; font-weight:700; text-decoration:none; }
        .open:hover { text-decoration:underline; }
        @media (max-width:760px) { .grid { grid-template-columns:1fr; } body { padding:32px 20px; } }
    </style>
</head>
<body>
    <main>
        <a class="back" href="{% url 'home' %}">&larr; Voltar ao painel principal</a>
        <h1>Telas para o Usu&aacute;rio Final</h1>
        <p class="intro">Painel de desenvolvimento isolado das telas mobile dos pacientes.</p>
        <section class="grid" aria-label="Telas de pacientes">
            {% for screen in screens %}
                <article class="card">
                    <span class="label">Tela mobile</span>
                    <h2>{{ screen.title }}</h2>
                    <p class="owner">Respons&aacute;vel: {{ screen.owner }}</p>
                    <code class="route">{{ screen.path }}</code>
                    <a class="open" href="{{ screen.path }}">Abrir tela &rarr;</a>
                </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
