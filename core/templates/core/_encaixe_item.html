<div class="encaixe-item">
  <div class="encaixe-info">
    <div>
      <div class="encaixe-name">{{ request.name }}</div>
      <div class="encaixe-mother">Mãe: {{ request.mother }}</div>
      <div class="encaixe-spec">{{ request.specialty }}</div>
    </div>
    <div class="encaixe-time">
      <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      {{ request.time }}
    </div>
  </div>
  <div class="encaixe-actions">
    <button type="button" class="action-btn approve"><svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>Aprovar</button>
    <button type="button" class="action-btn redirect"><svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Redirecionar</button>
  </div>
</div>
